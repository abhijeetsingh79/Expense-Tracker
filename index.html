<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #212121;
            color: #fff;
            font-family: 'Poppins', sans-serif;
        }
        
        nav{
            display: flex;
            justify-content: space-between;
            background-color: rgb(255,255,255,0.1);
            height: 50px;
            align-items: center;
            padding-left: 20px;
            padding-right: 20px;
            position: relative;
        }

        .nav-links a{
            text-decoration: none;
            color: #cfcfcf;
            font-weight: 500;
        }

        .nav-links{
            display: flex;
            gap: 1.5rem;
        }

        #menu-btn{
            width: 25px;
            display: none;
            background-color: #3b3b3b;
            color: white;;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            
        }

        .link-button{
            display: flex;
            gap: 15px;
            align-items: center;
        }

        h2{
            font-size: 24px;
            cursor: pointer;
            color: #ff782e;
        }


        
        .inputExpense, .ExpenseCategory{
            box-sizing: content-box;
            background-color: #1c2029;
            border: none;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            color: #fff;
            border: 2px solid #2d3343;
            
        }
        .inputExpense:focus {
            border: 2px solid #ff722f;
             outline: none;
        }

        .ExpenseCategory:focus {
            border: 2px solid #ff722f;
             outline: none;
        }

        .inputs{
            display: flex;
            gap: 1rem;
        }

        .AddExpenseBtn{
            width: 5rem;
            height: 2.3rem;
            
            background-color: #ff782e; 
            border: none;
            color: #fff;
            border-radius: 4px;
            cursor: pointer;
            
 
        }

        .AddExpenseBtn:active{
            transform: scale(0.94);
            box-shadow: 0 0 5px rgba(255, 116, 41, 0.3);
        }


        .total-expenses{
            color: #ff782e;
            font-weight: 600;
            font-size: 1.3rem;
            
        }

        .total{
            font-size: 1rem;
        }

        .container{
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            width:510px;
            padding-left: 20px;
            /* background-color: #fff; */
        }

        .Expenses-divs{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ErrorDiv{
            width: fit-content;
            background-color: #352222;
            border: 1px solid #7f3838;
            border-radius: 4px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 3px;
            padding-bottom: 3px;
            margin-top: 3px;
           

        }


        @media (max-width: 768px) {
            h2{
                font-size: 16px;
            }

            .nav-links {
                display: none;
                flex-direction: column;

                position: absolute;
                top: 50px;
                right: 0;

                width: 50vw;
                height: 100vh;
                padding: 15px;

                background-color: #333;
                gap: 20px;
            }

            

            #menu-btn {
                display: block;
            }

            .total{
                font-size: 14px;
                margin-left: 3px;
            }
            .total-expenses{
                font-size: 18px;
            }

            .container{
                
                width: 94vw;
                flex-direction: column;
                margin-left: 8px;
            }

            .inputs{
                flex-direction: column;
            }

            .AddExpenseBtn{
                width: 100%;
                border-radius: 8px;
            }



        }


  
    </style>
</head>
<body>
    <nav>
        <h2>Expense Tracker</h2>

        <div class="link-button">

        <div class="nav-links">
            <a href="./index.html">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Blogs</a>
            <a href="https://www.linkedin.com/in/abhijeet-singh79/" target="_blank">Follow Us</a>
            <a href="#">Contact Us</a>
        </div>

        <button id="menu-btn">☰</button>

        </div>
    </nav>

    <main>
        <div class="container">

            <div class="total">Total Expenses: <span class="total-expenses"></span></div>
            <!-- <span>Expense</span> -->
            
            <div class="inputs">
            <input type="text" placeholder="Add Your Expense" class="inputExpense">
            <input type="text" placeholder="Add Exppense category" class="ExpenseCategory">
            
            
            <button class="AddExpenseBtn">Add</button>
            </div>
            
            

            <p class="ShowError" ></p>

            <div class="Expenses-divs">

            </div>

        </div>
    
    
    
    
    </main>

    
</body>
<script> 

    // navbar
    const menuBtn = document.querySelector('#menu-btn')
    const navLink = document.querySelector('.nav-links')

    const showError = document.querySelector('.ShowError')
    menuBtn.addEventListener('click', (e)=>{
        if(navLink.style.display==='none'){
            navLink.style.display = 'flex';
        } else{
            navLink.style.display = 'none';
        }
    })


    // main
    

    let total = 0;
    const totalExpense = document.querySelector('.total-expenses')
    let InputExpense = document.querySelector('.inputExpense')
    const addExpense = document.querySelector('.AddExpenseBtn')
    const ShowError = document.querySelector('.ShowError')

    const ExpenseCategory = document.querySelector('.ExpenseCategory')
    const ExpenseDivs = document.querySelector('.Expenses-divs')

    totalExpense.innerHTML = `${total}₹`;

    
    let mainCode=()=>{
        let InputExpenseValue = parseFloat(InputExpense.value)
        let ExpenseCategoryValue = ExpenseCategory.value
        InputExpense.addEventListener("focus", () => {
                    InputExpense.style.border= "2px solid #ff722f";
                });

                ExpenseCategory.addEventListener("focus", ()=>{
                    InputExpense.style.border= "2px solid #ff722f";
                });



         if(isNaN(InputExpenseValue) || InputExpenseValue<0){
            redInputfn("first");
            ShowErrorfn(`⚠ Please enter a valid Expense Value`)

        } else if(!ExpenseCategoryValue|| !(/[a-zA-Z]/.test(ExpenseCategoryValue))){
            InputExpense.style.border= "2px solid #2d3343";
            
            
            redInputfn("second")
            ShowErrorfn('⚠ Please Enter a Valid Expense Category')
        } 
        else{
            InputExpense.style.border = "2px solid #2d3343"
            ExpenseCategory.style.border = "2px solid #2d3343"

            showError.innerHTML = "";
            ShowError.classList.remove('ErrorDiv');
            
            total+=InputExpenseValue;
            totalExpense.innerHTML=`${total}₹`;

            InputExpense.value = ''
            ExpenseCategory.value = ''

            ExpenseDivAdd(InputExpenseValue, ExpenseCategoryValue);

        }
    }


    addExpense.addEventListener('click', (e)=>{

        e.preventDefault()
        mainCode();
    });


    ExpenseCategory.addEventListener('keydown', (e)=>{
           
        if(e.key==="Enter"){
            e.preventDefault();
            mainCode();
        }

        });
        
    

    const ShowErrorfn = (message)=>{
        ShowError.innerHTML = message;
        ShowError.classList.add('ErrorDiv');
    }

    const redInputfn=(which)=>{
        if(which==="first"){
            InputExpense.style.border = "2px solid #ff5c5c";
        } else{
            ExpenseCategory.style.border = "2px solid #ff5c5c";
        }
    }
    
    const ExpenseDivAdd=(expense, category)=>{
        const createdDiv = document.createElement('div')
        createdDiv.innerHTML = `Expense: ${expense}, Category: ${category}`
        createdDiv.style.backgroundColor= "#2b2b2b"
        createdDiv.style.height = "2rem"
        createdDiv.style.borderRadius = "6px"
        createdDiv.style.display = "flex"
        createdDiv.style.alignItems = "center"
        createdDiv.style.fontSize = "0.85rem"
        createdDiv.style.padding = "5px"
        createdDiv.style.width = "100%"
        createdDiv.style.color = "#f5f5f5"
        


        ExpenseDivs.appendChild(createdDiv)
    }



</script>


</html>
